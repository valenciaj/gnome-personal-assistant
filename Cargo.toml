[package]
name = "gnome-personal-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
gst = { version = "0.25.4", package = "gstreamer" }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_49"] }
ksni = "0.3.6"
log = "0.4.34"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync", "fs"] }
toml = "1.1.8"

[profile.release]
lto = "thin"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "net", "io-util"] }
