[package]
name = "gnome-personal-assistant"
version = "0.1.0"
edition = "2024"
description = "Voice assistant for GNOME with notes and task lists"
authors = ["Javier Valencia <javier.valencia@voiper.es>"]
readme = "README.md"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
gettext = "0.4.0"
gst = { version = "0.25.4", package = "gstreamer" }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_49"] }
ksni = "0.3.6"
log = "0.4.34"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sourceview5 = "0.11.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync", "fs"] }
toml = "1.1.8"

[profile.release]
lto = "thin"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "net", "io-util"] }

[package.metadata.deb]
section = "utils"
priority = "optional"
extended-description = "Press a global shortcut, speak, and an AI model (Anthropic, OpenAI, Ollama or any OpenAI-compatible server) answers. It can create and manage notes, notebooks, tags and task lists with reminders. Built with GTK4 and libadwaita."
depends = "$auto, gstreamer1.0-pipewire, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good"
recommends = "gnome-shell-extension-appindicator, gnome-keyring"
assets = [
    ["target/release/gnome-personal-assistant", "usr/bin/", "755"],
    ["data/io.github.valenciaj.PersonalAssistant.desktop", "usr/share/applications/", "644"],
    ["data/icons/io.github.valenciaj.PersonalAssistant.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/gnome-personal-assistant/", "644"],
]
